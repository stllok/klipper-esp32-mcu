[package]
name = "firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.2.2", features = ["esp32", "unstable"] }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32"] }
klipper-esp32-mcu = { path = ".." }

critical-section = "1.2.0"
esp-backtrace = {
  version = "0.20.0",
  features = [
    "esp32",
    "panic-handler",
    "println",
  ]
}
esp-println = { version = "0.18.0", features = ["esp32"] }
nb = "=1.1.0"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
opt-level = 3
debug = 0  # switch back to 2 on dev
lto = "fat"
codegen-units = 1  # LLVM can perform better optimizations using a single thread
