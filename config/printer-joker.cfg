# Klipper config for the MagicMaker JOKER (ESP32) board running this firmware.
# Machine settings come from /mnt/ssd/data/git/joker-marlin (Sluban SSS 220
# build of Marlin 2.1.3-b3): 220x220x140 bed-slinger, BMG extruder, SN04-N
# probe, stock SSD1306 OLED + encoder. Nothing here is physically verified;
# follow that README's first-start order (sensors, switches, directions,
# homing, heaters, probe) before printing.
#
# Output pins sr0..sr15 are 74HC595 bits (Marlin pin 128+n).

# Stock fluidd-config client.cfg: virtual_sdcard, pause_resume, display_status,
# respond, PAUSE/RESUME/CANCEL_PRINT. Tuned via _CLIENT_VARIABLE below.
[include fluidd.cfg]

[mcu]
# by-id path survives the CH340 re-enumerating as ttyUSB1 after a replug.
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000
restart_method: arduino

[printer]
kinematics: cartesian
# Measured (no heat, re-home drift check): Y (bed) skips 5 mm at 300 mm/s
# with 3000 accel; 250 mm/s at 3000 and 4000 accel held. 240 = ~80% of the
# skip point. MCU step budget is 50k steps/s; 240 mm/s = 24k/axis.
# Accel: 4000 held, kept at 3000 until [input_shaper] is tuned (ringing).
max_velocity: 240
max_accel: 3000
# Klipper's default 0.5: short zig-zags don't reach full speed (less ringing).
minimum_cruise_ratio: 0.5
# T8x2 lead screw, 1600 steps/mm: 10 mm/s = 16k steps/s.
max_z_velocity: 10
max_z_accel: 200
square_corner_velocity: 5.0

# No accelerometer: tune from a printed ringing tower
# (klipper docs/Resonance_Compensation.md, "manual" method), then uncomment.
# Bed-slinger Y is usually much lower than X.
#[input_shaper]
#shaper_type_x: mzv
#shaper_freq_x: 50
#shaper_type_y: mzv
#shaper_freq_y: 35

# TMC2208/2209 standalone at 16 microsteps (check MS1/MS2 straps).
# X and Y share one enable line (sr8), so both use the same enable_pin.
# Directions mirror Marlin INVERT_*_DIR (X=true Y=false Z=true E=false).
[stepper_x]
step_pin: sr0
dir_pin: !sr1
enable_pin: !sr8
microsteps: 16
rotation_distance: 32
# Switches are normally open, active LOW with pull-up.
endstop_pin: ^!gpio15
position_endstop: 220
position_max: 220
homing_speed: 50
homing_retract_dist: 5

[stepper_y]
step_pin: sr2
dir_pin: !sr3
enable_pin: !sr8
microsteps: 16
rotation_distance: 32
endstop_pin: ^!gpio16
position_endstop: 0
position_max: 220
homing_speed: 50
homing_retract_dist: 5

[stepper_z]
step_pin: sr4
dir_pin: sr5
enable_pin: !sr9
microsteps: 16
rotation_distance: 2
# Z homes on the probe (see [safe_z_home]); switch on ^!gpio17 unused.
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 140
homing_speed: 4
homing_retract_dist: 2

[extruder]
step_pin: sr6
dir_pin: sr7
enable_pin: !sr10
microsteps: 16
# 387 steps/mm (BMG starting value): calibrate.
rotation_distance: 8.269
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_only_distance: 200
max_extrude_only_velocity: 25
pressure_advance: 0.22
heater_pin: sr13
# ADC reports calibrated mV against ADC_MAX=3300, i.e. a 3.3 V reference.
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio36
pullup_resistor: 4700
#control: pid
#pid_Kp: 22.20
#pid_Ki: 1.08
#pid_Kd: 114.00
min_temp: 5
max_temp: 265
min_extrude_temp: 170

[verify_heater extruder]
# Marlin THERMAL_PROTECTION_PERIOD/HYSTERESIS 40 s / 4 C, WATCH 40 s / 2 C.
hysteresis: 4
check_gain_time: 40
heating_gain: 2

[heater_bed]
heater_pin: sr12
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio39
pullup_resistor: 4700
#control: pid
#pid_Kp: 10.00
#pid_Ki: 0.023
#pid_Kd: 305.4
min_temp: 5
max_temp: 120

# FANh (sr14): shared hotend/part fan, on above 50 C like Marlin E0_AUTO_FAN.
[heater_fan hotend_fan]
pin: sr15
heater: extruder
heater_temp: 50.0

# FANm (sr15) is unused on this machine; kept so slicer M106/M107 work.
# Soft PWM on a 595 bit: keep the cycle slow.
[fan]
pin: sr14
cycle_time: 0.010

# SN04-N inductive probe, NPN normally open, on the C connector (GPIO14).
# Also used as the Z endstop.
[probe]
pin: ^!gpio14
x_offset: -24
y_offset: -24
# Paper-test PROBE_CALIBRATE result.
z_offset: 2.858
speed: 4
lift_speed: 4
samples: 2
sample_retract_dist: 2
# Re-probe a point if its samples disagree (PROBE_ACCURACY range was 0.0175).
samples_result: median
samples_tolerance: 0.02
samples_tolerance_retries: 3

# Home Z with the probe over bed centre (nozzle 134,134 -> probe 110,110).
[safe_z_home]
home_xy_position: 134, 134
speed: 50
z_hop: 10
z_hop_speed: 5

# Manual leveling helper: SCREWS_TILT_CALCULATE. Points are nozzle positions;
# probe = nozzle - 24. Screws sit at the bed edge (~2/218 mm). Probe reaches
# 2 on the low side but only 196 on the high side (nozzle max 220), so right/
# front points probe ~22 mm inboard of the screw. X=0 left, Y=0 rear.
[screws_tilt_adjust]
screw1: 50, 52
screw1_name: rear left
screw2: 220, 52
screw2_name: rear right
screw3: 220, 220
screw3_name: front right
screw4: 50, 220
screw4_name: front left
horizontal_move_z: 10
speed: 50
screw_thread: CW-M3

[bed_mesh]
speed: 100
# SN04 triggers ~2.9 mm above bed (z_offset 2.858): travel must stay well
# clear of that or probing fails with "Probe triggered prior to movement".
horizontal_move_z: 6
# Probe coordinates; 30 mm margin like Marlin PROBING_MARGIN.
mesh_min: 30, 30
mesh_max: 190, 190
# Saved mesh spans ~0.3 mm (front edge high): denser grid + bicubic follows it.
# Points land on 30, 56.7, 83.3, 110, ... so 110 (Z home spot) is a sample.
probe_count: 7, 7
algorithm: bicubic
bicubic_tension: 0.2
mesh_pps: 2, 2
# Probe point under the Z home position (nozzle 134,134): mesh is zeroed
# there so z_offset stays valid regardless of where the mesh dips.
zero_reference_position: 110, 110
# Blend mesh out over the first 10 mm; above that Z is straight again.
fade_start: 1
fade_end: 10
# BED_MESH_CALIBRATE ADAPTIVE=1 only probes the print area (needs
# [exclude_object] + slicer object labels).
adaptive_margin: 5

# Object labels from slicer: enables adaptive mesh and EXCLUDE_OBJECT.
[exclude_object]

# G2/G3 support (slicer arc fitting -> smoother curves, less serial traffic).
[gcode_arcs]
resolution: 0.5

# G10/G11 so retraction can be tuned live with SET_RETRACTION.
[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 30

[idle_timeout]
timeout: 900

# Slicer start gcode:
#   PRINT_START BED=[first_layer_bed_temperature] HOTEND=[first_layer_temperature]
# (Cura: BED={material_bed_temperature_layer_0} HOTEND={material_print_temperature_layer_0})
[gcode_macro PRINT_START]
gcode:
    {% set bed = params.BED|default(60)|float %}
    {% set hotend = params.HOTEND|default(210)|float %}
    M140 S{bed}
    M104 S150                      ; warm nozzle, no ooze while probing
    G90
    G28
    M190 S{bed}                    ; probe a hot (expanded) bed
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE ADAPTIVE=1
    G1 Z5 F600
    G1 X5 Y20 F6000
    M109 S{hotend}
    # Purge line along the left edge.
    G92 E0
    G1 Z0.3 F600
    G1 Y200 E15 F1200
    G1 X5.4 F3000
    G1 Y20 E30 F1200
    G92 E0
    G1 Z2 F600

[gcode_macro PRINT_END]
gcode:
    G91
    G1 E-2 F1800
    {% set z = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z]|min %}
    G90
    G1 Z{z} F600                   ; lift without hitting Z max
    G1 X0 Y220 F6000               ; present bed
    M104 S0
    M140 S0
    M106 S0
    M84

# Settings for fluidd.cfg PAUSE/RESUME/CANCEL_PRINT (see that file's header).
[gcode_macro _CLIENT_VARIABLE]
# Park front-left (Y=220 is front) so the nozzle is reachable.
variable_use_custom_pos   : True
variable_custom_park_x    : 0.0
variable_custom_park_y    : 220.0
variable_custom_park_dz   : 5.0
# Retract via G10/G11 with [firmware_retraction] settings.
variable_use_fw_retract   : True
variable_retract          : 0.8
variable_unretract        : 0.8
variable_cancel_retract   : 2.0
variable_speed_retract    : 35.0
variable_speed_unretract  : 30.0
variable_speed_hop        : 10.0
variable_speed_move       : 150.0
variable_park_at_cancel   : True
# Paused prints keep heaters for 30 min instead of idle_timeout's 15.
variable_idle_timeout     : 1800
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "M84"
gcode:

# Slicer filament change: park with at least 50 mm under the nozzle.
[gcode_macro M600]
description: Filament change
gcode:
    PAUSE Z_MIN=50

# Orange Pi Zero3 SoC temperature, graphed in Fluidd.
[temperature_sensor host]
sensor_type: temperature_host

[output_pin beeper]
pin: sr11

# Stock SSD1306 OLED (header GND VCC SCL SDA) on I2C0: SDA gpio21, SCL gpio22.
# Encoder: EN1 gpio2, EN2 gpio4, button gpio12 (order verified on hardware).
[display]
lcd_type: ssd1306
i2c_bus: i2c0
encoder_pins: ^gpio4, ^gpio2
click_pin: ^!gpio12

# Disabled in the Marlin build too; GPIO13, active LOW = no filament.
#[filament_switch_sensor runout]
#switch_pin: ^gpio13
#pause_on_runout: True

[force_move]
enable_force_move: True

